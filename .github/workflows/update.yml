name: Update NHL data feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch MoneyPuck feed
        run: python update_feed.py
      - name: Commit changed feed
        run: |
          git config user.name "nhl-totals-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nhl_feed.json
          git diff --cached --quiet || git commit -m "Update NHL data feed"
          git push
